yumi_scheduler: true
dynamic_enabled: true
global_mode: "powersave"

app_modes:
  com.miHoYo.GenshinImpact: "fas"
  com.tencent.tmgp.sgame: "fas"
  com.tencent.tmgp.speedmobile: "fas"
  com.tencent.lolm: "fas"

ignored_apps:
  - com.android.systemui

fas_rules:
  # Use system to keep the previous governor or specify a supported governor such as schedutil.
  governor: system
  freq_range_steps_below: 1  # Maximum frequency steps below the target. Use 0 for a single frequency.
  # ── Default frame-rate tiers for games without a per_app_profiles entry ──
  fps_gears: [30.0, 60.0, 90.0, 120.0, 144.0]
  fps_margin: 3.0

  # ── Per-game FAS settings ──
  # target_fps: Target frame rates the game can render at, matched at runtime
  # fps_margin: Optional frame-rate margin for this game. Defaults to the global value.
  per_app_profiles:
    "com.miHoYo.GenshinImpact":
      target_fps: [30, 60]
      fps_margin: 4.0

    "com.tencent.tmgp.pubgmhd":
      target_fps: [60, 90, 120]
      fps_margin: 3.0

    "com.tencent.tmgp.speedmobile":
      target_fps: [30, 60, 120, 144]
      fps_margin: 3.0

    "com.tencent.tmgp.sgame":
      target_fps: [60, 90, 120]
      fps_margin: 3.0

    "com.hypergryph.arknights":
      target_fps: [30, 60]

    "com.miHoYo.hkrpg":
      target_fps: [30, 60]

    "com.kurogame.mingchao":
      target_fps: [24, 30, 45, 60]

    "com.tencent.lolm":
      target_fps: [60, 90, 120, 144]
      fps_margin: 3.0

  # ── Core PID controller coefficients ──
  pid:
    kp: 0.05
    ki: 0.01
    kd: 0.006

  # ── CPU cluster capacity weighting ──
  auto_capacity_weight: true
  cluster_profiles:
    - capacity_weight: 1.0   # Little cores
    - capacity_weight: 1.5   # Medium cores
    - capacity_weight: 2.5   # Big cores
    - capacity_weight: 3.5   # Prime cores

  # ── Normalized performance (Perf) range ──
  perf_floor: 0.22
  perf_ceil: 1.0
  perf_init: 0.45
  perf_cold_boot: 0.85
  freq_hysteresis: 0.015

  # ── Heavy frames / intensive loading ──
  heavy_frame_threshold_ms: 150.0
  loading_cumulative_ms: 2500.0
  loading_normal_tolerance: 3
  loading_perf_floor: 0.60
  loading_perf_ceiling: 0.70

  # ── Post-load protection ──
  post_loading_ignore_frames: 5
  post_loading_perf: 0.65
  post_loading_downgrade_guard: 90

  # ── Tier switching and damping ──
  upgrade_confirm_frames: 60
  downgrade_confirm_frames: 90
  upgrade_cooldown_after_downgrade: 90
  gear_dampen_frames: 60

  # ── Emergency frequency boost on tier drops ──
  downgrade_boost_perf_inc: 0.18
  downgrade_boost_duration: 45

  # ── Fast decay under sustained steady load to save power ──
  fast_decay_frame_threshold: 75
  fast_decay_perf_threshold: 0.70
  fast_decay_max_step: 0.022
  fast_decay_min_step: 0.004

  # ── Jank protection cooldown ──
  jank_cooldown_frames: 15

  # ── PID output limits to prevent overshoot ──
  max_inc_damped: 0.045
  max_inc_normal: 0.075
  damped_perf_cap: 0.92

  # ── App switching / screen-off detection ──
  app_switch_gap_ms: 3000.0
  app_switch_resume_perf: 0.60

  # ── Other low-level settings ──
  freq_force_reapply_interval: 30  # Frames between reevaluations that bypass frequency hysteresis. 0 disables this.
  verify_freq_interval_secs: 3    # Seconds between checks of effective frequency limits. 0 disables this.
  fixed_max_frame_ms: 500.0
  cold_boot_ms: 3500